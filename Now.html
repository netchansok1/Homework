<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Chance Sale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .banner {
            position: relative;
            width: 900px;
            height: 500px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Content Left Section */
        .content-left {
            position: relative;
            z-index: 2;
        }

        .yellow-circle {
            position: absolute;
            width: 140px;
            height: 140px;
            background-color: #f4b41a;
            border-radius: 50%;
            top: -25px;
            left: -40px;
            z-index: -1;
        }

        .last-chance {
            font-size: 18px;
            letter-spacing: 3px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .discount-text {
            font-size: 96px;
            font-weight: bold;
            color: #4a5568;
            line-height: 1;
        }

        .off-all {
            font-size: 40px;
            font-weight: bold;
            color: #4a5568;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .image-source {
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .btn-start {
            display: inline-block;
            background-color: #f4b41a;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-decoration: none;
            border-radius: 2px;
            transition: background 0.3s ease;
        }

        .btn-start:hover {
            background-color: #dda215;
        }

        /* Graphic Right Section (Placeholder layout for cart/boxes) */
        .content-right {
            position: relative;
            width: 400px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .illustration-placeholder {
            font-size: 14px;
            color: #aaa;
            border: 2px dashed #e2e8f0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="banner">
        <!-- Left Side Content -->
        <div class="content-left">
            <div class="yellow-circle"></div>
            <div class="last-chance">LAST CHANCE</div>
            <div class="discount-text">70%</div>
            <div class="off-all">OFF ALL</div>
            <div class="image-source">Image from Freepik</div>
            <a href="#" class="btn-start">START NOW</a>
        </div>

        <!-- Right Side Graphic (Insert your cart/boxes image here) -->
        <div class="content-right">
            <div class="illustration-placeholder">
                <img src="https://i.pinimg.com/736x/b8/1d/bc/b81dbcb8e56f085ec302255eabaf8df6.jpg" alt="">
            </div>
        </div>
    </div>

</body>
</html>
